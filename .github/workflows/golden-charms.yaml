name: Test golden charms (weekly)

on:
  schedule:
    - cron: "0 21 * * 1"  # Tuesdays 05:00 UTC+8

permissions: {}

jobs:
  golden-charms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Run functional tests for golden charms
        env:
          UV_PYTHON: '3.11'
          # Golden charms pull large images, so the weekly run pins one
          # runtime instead of doubling the cost with a matrix.
          JJX_RUNTIME: docker
        run: uvx --from rust-just@1.59.0 just golden
