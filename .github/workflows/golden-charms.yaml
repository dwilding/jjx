name: Test golden charms (weekly)

on:
  schedule:
    - cron: "0 21 * * 1"

permissions: {}

jobs:
  golden-charms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Run functional tests for golden charms
        env:
          UV_PYTHON: '3.10'
        run: uvx --from rust-just@1.58.0 just golden
