name: Test golden charms (weekly)

on:
  schedule:
    - cron: "0 21 * * 1"  # Tuesdays 05:00 UTC+8

permissions: {}

jobs:
  golden-charms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Run functional tests for golden charms
        env:
          UV_PYTHON: '3.11'
        run: uvx --from rust-just@1.59.0 just golden
