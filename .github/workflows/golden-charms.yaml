name: Test golden charms (weekly)

on:
  schedule:
    - cron: "0 21 * * 1"

permissions: {}

jobs:
  golden-charms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - name: Run functional tests for golden charms
        env:
          UV_PYTHON: '3.10'
        run: uvx --from rust-just@1.58.0 just golden
