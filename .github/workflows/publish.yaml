name: Publish

on:
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish-jjx
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Build package
        run: uv build
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  start-next-dev:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Bump package version
        run: |
          new="$(uv version --bump patch --bump dev=0 --short --no-sync)"
          sed -i "s/^__version__ = \".*\"/__version__ = \"$new\"/" src/jjx/_version.py
      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          git checkout -b "bump-to-$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "bump package to $version"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "bump-to-$version"
          gh pr create --base main --head "bump-to-$version" \
            --title "chore: bump package to $version" \
            --body "" \
            --reviewer dwilding
