# Guards against merging a lockfile that's misaligned with pyproject.toml.
# Other workflows update the lockfile automatically instead of requiring alignment.
name: Check Python deps

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Check uv.lock
        run: uv lock --check
