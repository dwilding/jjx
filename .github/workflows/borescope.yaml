name: Borescope tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  borescope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Check out Ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: canonical/operator
          ref: main
          fetch-depth: 1
          path: operator
      - name: Run httpbin-demo
        working-directory: operator/examples/httpbin-demo
        run: uvx --with-editable "$GITHUB_WORKSPACE" jjx -d
      - name: Probe services
        working-directory: operator/examples/httpbin-demo
        run: |
          services=$(uvx borescope@1.1.0 --socket .jjx/socket --command services)
          echo "$services"
          echo "$services" | grep httpbin
          echo "$services" | grep active
      - name: Probe processes
        working-directory: operator/examples/httpbin-demo
        run: |
          processes=$(uvx borescope@1.1.0 --socket .jjx/socket --command ps)
          echo "$processes"
          echo "$processes" | grep gunicorn
      - name: Tear down
        working-directory: operator/examples/httpbin-demo
        run: uvx --with-editable "$GITHUB_WORKSPACE" jjx down
