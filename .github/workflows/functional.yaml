name: Functional tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install bubblewrap
        run: sudo apt-get install -y bubblewrap apparmor
      - name: Configure AppArmor policy for bubblewrap
        shell: bash
        run: |
          set -euxo pipefail
          BWRAP_PATH="$(command -v bwrap)"
          sudo tee /etc/apparmor.d/jjx-bwrap >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile jjx-bwrap ${BWRAP_PATH} flags=(unconfined) {
            userns,
            include if exists <local/jjx-bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/jjx-bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc -- true
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
      - name: Diagnostics
        shell: bash
        run: |
          echo "=== uv version ==="
          uv --version
          echo "=== UV_PYTHON ==="
          echo "UV_PYTHON=${UV_PYTHON}"
          echo "=== charm dir contents ==="
          ls -la tests/functional/charms/k8s-4-action/
          echo "=== charm pyproject.toml ==="
          cat tests/functional/charms/k8s-4-action/pyproject.toml
      - name: Run functional tests
        env:
          UV_PYTHON: '3.10'
        shell: bash
        # -s disables output capture so diagnostic prints are visible in the CI log
        run: uv run pytest -vv -s tests/functional
