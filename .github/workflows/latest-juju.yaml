name: Simulate latest Juju version (weekly)

on:
  schedule:
    - cron: "0 21 * * 5"  # Saturdays 05:00 UTC+8
  workflow_dispatch:

permissions: {}

jobs:
  latest-juju:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Set latest Juju version
        run: uv run --script .github/scripts/set_latest_juju.py
      - name: Open a PR if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          version=$(sed -n 's/^JUJU_VERSION = "\(.*\)"/\1/p' src/jjx/_version.py)
          branch="simulate-juju-$version"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR for Juju $version already exists"
            exit 0
          fi
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "claim to be Juju $version"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "feat: simulate Juju $version" \
            --body "" \
            --reviewer dwilding
