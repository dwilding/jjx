name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! gh release view "$version" >/dev/null 2>&1; then
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  wait-checks:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.wait.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for checks
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          release=false
          # Wait for all other workflow runs on this SHA to complete.
          other_runs="$(gh run list --branch main --limit 50 --json databaseId,headSha --jq ".[] | select(.headSha == \"${sha}\") | .databaseId")"
          other_runs="$(echo "$other_runs" | grep -v "${{ github.run_id }}" || true)"
          all_passed=true
          for run in $other_runs; do
            if ! gh run watch "$run" --exit-status >/dev/null 2>&1; then
              all_passed=false
            fi
          done
          if [[ "$all_passed" == "true" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  create-draft:
    runs-on: ubuntu-latest
    needs:
      - check-version
      - wait-checks
    if: needs.wait-checks.outputs.release == 'true'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Create draft release
        id: draft
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$(uv run --script .github/scripts/write_release_notes.py "$VERSION")"
          gh release create "$VERSION" --draft --target main --title "$VERSION" --notes "$notes"
