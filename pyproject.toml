[project]
name = "jjx"
version = "0.4.0"
description = "A Juju-on-Docker test adapter for Kubernetes charms."
authors = [
    { name = "Dave Wilding", email = "tech@dpw.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.3",
    "tomli==2.4.1 ; python_full_version < '3.11'",
]

[project.scripts]
jjx = "jjx._cli:jjx_cli"
juju = "jjx._cli:juju_cli"

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pytest==9.1.1",
    "ty==0.0.65",
    "zizmor==1.29.0",
]

[build-system]
requires = [
    "uv_build==0.12.1",
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
extend-exclude = [
    "tests/functional/charms",
]

[tool.ty.src]
exclude = [
    "tests/functional/charms",
]

[tool.pytest.ini_options]
norecursedirs = [
    "tests/functional/charms",
]
